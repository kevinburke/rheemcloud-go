env:
  TZ: UTC
  # v0.7.0 cannot read go1.27's export data ("export data version 4 is
  # greater than maximum supported version 2"). v0.8.1 is the latest release.
  STATICCHECK_VERSION: "v0.8.1"
  DIFFER_VERSION: "v1.4.0"

steps:
  - label: ":go: Format"
    key: "format"
    command: ".buildkite/ci/format.sh"
    timeout_in_minutes: 10
    agents:
      pool: "ci"
    artifact_paths:
      - "reports/format/**/*"

  - label: ":go: Lint"
    key: "lint"
    command: ".buildkite/ci/lint.sh"
    timeout_in_minutes: 10
    agents:
      pool: "ci"
    artifact_paths:
      - "reports/lint/**/*"

  - label: ":go: Test"
    key: "test"
    command: ".buildkite/ci/test.sh"
    timeout_in_minutes: 15
    agents:
      pool: "ci"
    artifact_paths:
      - "coverage/**/*"
      - "reports/tests/**/*"

  - label: ":go: Build"
    key: "build"
    command: ".buildkite/ci/build.sh"
    timeout_in_minutes: 10
    depends_on:
      - "format"
      - "lint"
      - "test"
    agents:
      pool: "ci"
    artifact_paths:
      - "reports/build/**/*"
      - "tmp/dist/**/*"
